  @keyframes tileblink { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .25; } }
  .tile.reveal rect { stroke: var(--good); stroke-width: 4; animation: tileblink .5s ease 3; }

  .bigbtn {

  .soundline { text-align: center; margin-top: 14px; }
  .soundbtn { border: 2px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 11px 18px; font-size: 13px; }

<div class="app">

  <!-- ホーム -->

      <button class="modebtn" data-mode="namae" style="--mcolor: var(--m-namae)">なまえクイズ <span class="best" id="best-namae"></span></button>
    </div>
    <div class="soundline">
      <button class="soundbtn" id="soundBtn">🔔 おと：オン</button>

  </div>

  <!-- ゲーム -->
  <div class="screen" id="scrGame">

    </div>

    <div class="mapwrap" id="gameMap"></div>
  </div>

    <div class="result">
      <div class="rstars" id="rstars"></div>
      <h2 id="rmsg"></h2>
      <div class="rtime" id="rtime"></div>
      <div class="bestbadge" id="bestBadge">🏆 じぶんベスト こうしん！</div>
      <div class="unlockbadge" id="unlockBadge"></div>
      <div class="rcat" aria-hidden="true" id="resultCat"></div>
      <div class="rbubble" id="rsay"></div>
      <div class="rbtns">
        <button class="bigbtn" id="againBtn">もういちど！</button>
        <button class="bigbtn ghost" id="homeBtn">もどる</button>
      </div>
    </div>
  </div>

</div>

    P("shiga", "しが", "しがけん", "滋賀県", "kinki", 5, 8),
    P("gifu", "ぎふ", "ぎふけん", "岐阜県", "chubu", 6, 8),
    P("yamanashi", "やまなし", "やまなしけん", "山梨県", "chubu", 7, 8),
    P("tokyo", "とうきょう", "とうきょうと", "東京都", "kanto", 8, 8),
    P("chiba", "ちば", "ちばけん", "千葉県", "kanto", 9, 8),
    P("fukuoka", "ふくおか", "ふくおかけん", "福岡県", "kyushu", 1, 9),
    P("nara", "なら", "ならけん", "奈良県", "kinki", 4, 9),
    P("mie", "みえ", "みえけん", "三重県", "kinki", 5, 9),
    P("aichi", "あいち", "あいちけん", "愛知県", "chubu", 6, 9),
    P("shizuoka", "しずおか", "しずおかけん", "静岡県", "chubu", 7, 9),
    P("kanagawa", "かながわ", "かながわけん", "神奈川県", "kanto", 8, 9),
    P("saga", "さが", "さがけん", "佐賀県", "kyushu", 0, 10),
    P("oita", "おおいた", "おおいたけん", "大分県", "kyushu", 1, 10),
    P("ehime", "えひめ", "えひめけん", "愛媛県", "shikoku", 2, 10),
    P("kagawa", "かがわ", "かがわけん", "香川県", "shikoku", 3, 10),
    P("wakayama", "わかやま", "わかやまけん", "和歌山県", "kinki", 4, 10),
    P("nagasaki", "ながさき", "ながさきけん", "長崎県", "kyushu", 0, 11),
    P("kumamoto", "くまもと", "くまもとけん", "熊本県", "kyushu", 1, 11),
    P("kochi", "こうち", "こうちけん", "高知県", "shikoku", 2, 11),
    P("tokushima", "とくしま", "とくしまけん", "徳島県", "shikoku", 3, 11),
    P("kagoshima", "かごしま", "かごしまけん", "鹿児島県", "kyushu", 0, 12),
    P("miyazaki", "みやざき", "みやざきけん", "宮崎県", "kyushu", 1, 12),
    P("okinawa", "おきなわ", "おきなわけん", "沖縄県", "kyushu", 0, 14)
  ];
  var BYID = {};
  PREFS.forEach(function (p) { BYID[p.id] = p; });

  /* かんたんモードの16けん（有名どころ） */
  var KANTAN16 = ["hokkaido", "aomori", "miyagi", "tokyo", "kanagawa", "chiba", "saitama",
    "niigata", "shizuoka", "aichi", "kyoto", "osaka", "hyogo", "hiroshima", "fukuoka", "okinawa"];

  /* ---- 地図SVGを組み立てる ----
     colored=true で地方の色分け＋地方名ラベル。タイルは .tile[data-id]。
     北海道だけ特大マス（2列×1.8行） */
  var TW = 44, TH = 34, GX = 47, GY = 37.5;
  var MAPLABELS = [
    { text: "とうほく", region: "tohoku", c: 6.6, r: 3.45 },
    { text: "ちゅうぶ", region: "chubu", c: 5.5, r: 5.45 },
    { text: "きんき", region: "kinki", c: 4.0, r: 6.4 },
    { text: "ちゅうごく", region: "chugoku", c: 1.0, r: 6.4 },
    { text: "かんとう", region: "kanto", c: 8.05, r: 10.3 },
    { text: "しこく", region: "shikoku", c: 2.3, r: 12.35 },
    { text: "きゅうしゅう", region: "kyushu", c: 0.25, r: 13.35 }
  ];
  function buildMap(container, colored) {
    var maxC = 9, maxR = 14;
    var w = (maxC + 1) * GX + 2, h = (maxR + 1) * GY + 2;
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
    PREFS.forEach(function (p) {
      var x = p.c * GX + 2, y = p.r * GY + 2;
      var big = p.id === "hokkaido";
      var tw = big ? TW + GX : TW;
      var th = big ? TH + GY * 0.8 : TH;
      var fill = colored ? "var(--rg-" + p.region + ")" : "var(--card)";
      var fs = big ? 15 : (p.name.length <= 3 ? 14.5 : (p.name.length <= 4 ? 12.5 : 11));
      var fit = (!big && p.name.length >= 4) ? ' textLength="' + (TW - 5) + '" lengthAdjust="spacingAndGlyphs"' : '';
      s += '<g class="tile" data-id="' + p.id + '" data-region="' + p.region + '" data-full="' + p.full + '">' +
        '<rect x="' + x + '" y="' + y + '" width="' + tw + '" height="' + th + '" rx="7" fill="' + fill + '"/>' +
        '<text x="' + (x + tw / 2) + '" y="' + (y + th / 2 + 1) + '" text-anchor="middle" dominant-baseline="central" font-size="' + fs + '"' + fit + '>' + p.name + '</text>' +
        '</g>';
    });
    if (colored) {
      MAPLABELS.forEach(function (L) {
        var x = L.c * GX + 2, y = L.r * GY + 2;
        s += '<g class="maplabel">' +
          '<circle cx="' + x + '" cy="' + y + '" r="6" fill="var(--rg-' + L.region + ')" stroke="var(--line)" stroke-width="1.5"/>' +
          '<text x="' + (x + 11) + '" y="' + y + '" dominant-baseline="central" font-size="13.5">' + L.text + '</text>' +
          '</g>';
      });
    }
    s += '</svg>';
    container.innerHTML = s;
  }

  /* ---- 保存 ---- */
  function loadData() {
    try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
    return { best: {}, sound: true };
  }
  function saveData() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  var data = loadData();
  if (!data.unlocked) data.unlocked = {};
  for (var mk in data.best) { if (data.best[mk]) data.unlocked[mk] = true; }

  /* ---- おと（WebAudio・こわれても無視） ---- */
  var actx = null;
  function beep(kind) {
    if (!data.sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime;
      var o = actx.createOscillator(); var g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.12, t);
      if (kind === "ok") {
        o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.09);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.start(t); o.stop(t + 0.25);
      } else if (kind === "ng") {
        o.frequency.setValueAtTime(220, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.start(t); o.stop(t + 0.2);
      } else {
        o.frequency.setValueAtTime(1568, t); o.frequency.setValueAtTime(2093, t + 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.5); o.start(t); o.stop(t + 0.5);
      }
    } catch (e) {}
  }

  /* ---- もんだいづくり ---- */
  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function makeSet(mode) {
    var qs = [];
    if (mode === "chihou") {
      var rs = shuffle(Object.keys(REGIONS));
      while (rs.length < N_Q) {
        var extra = Object.keys(REGIONS)[rnd(8)];
        if (extra !== rs[rs.length - 1]) rs.push(extra);
      }
      rs.slice(0, N_Q).forEach(function (rid) { qs.push({ kind: "region", target: rid }); });
      return qs;
    }
    if (mode === "kantan" || mode === "zenbu") {
      var pool = mode === "kantan" ? KANTAN16 : PREFS.map(function (p) { return p.id; });
      shuffle(pool).slice(0, N_Q).forEach(function (pid) { qs.push({ kind: "find", target: pid }); });
      return qs;
    }
    // なまえクイズ：光っているけんの名前を3たくで
    shuffle(PREFS.map(function (p) { return p.id; })).slice(0, N_Q).forEach(function (pid) {
      var p = BYID[pid];
      var same = PREFS.filter(function (q) { return q.region === p.region && q.id !== pid; });
      var others = PREFS.filter(function (q) { return q.region !== p.region; });
      var d1 = same.length ? same[rnd(same.length)] : others[rnd(others.length)];
      var d2;
      do { var cand = Math.random() < 0.5 && same.length > 1 ? same[rnd(same.length)] : others[rnd(others.length)]; d2 = cand; }
      while (d2.id === d1.id || d2.id === pid);
      qs.push({ kind: "name", target: pid, choices: shuffle([p, d1, d2]).map(function (q) { return q.id; }) });
    });
    return qs;
  }

  /* ---- 画面きりかえ ---- */
  function show(id) {
    var scrs = document.querySelectorAll(".screen");
    for (var i = 0; i < scrs.length; i++) scrs[i].className = "screen";
    document.getElementById(id).className = "screen show";
  }

  /* ---- ホーム ---- */
  function fmtTime(ms) { return (ms / 1000).toFixed(1) + "びょう"; }
  function renderHome() {
    for (var k in MODES) {
      var el = document.getElementById("best-" + k);
      var btn = document.querySelector('.modebtn[data-mode="' + k + '"]');
      if (!isOpen(k)) {
        btn.classList.add("locked");
        btn.setAttribute("aria-disabled", "true");
        el.textContent = "🔒 " + LOCK_HINT[k] + "で パーフェクトを とると ひらくよ";
      } else {
        btn.classList.remove("locked");
        btn.removeAttribute("aria-disabled");
        var b = data.best[k];
        el.textContent = b ? "ベスト：" + b.correct + "もん・" + fmtTime(b.timeMs) : "";
      }
    }
    document.getElementById("soundBtn").textContent = data.sound ? "🔔 おと：オン" : "🔕 おと：オフ";
  }
  document.getElementById("soundBtn").addEventListener("click", function () {
    data.sound = !data.sound; saveData(); renderHome();
  });

  /* ---- ずかん ---- */
  var zukanBuilt = false;
  function openZukan() {
    if (!zukanBuilt) { buildMap(document.getElementById("zukanMap"), true); zukanBuilt = true; }
    document.getElementById("zukanSay").innerHTML = "しりたい けんを タップしてね";
    var sel = document.querySelector("#zukanMap .tile.target");
    if (sel) sel.classList.remove("target");
    show("scrZukan");
  }
  document.getElementById("zukanMap").addEventListener("click", function (e) {
    var g = e.target.closest ? e.target.closest(".tile") : null;
    if (!g) return;
    var p = BYID[g.getAttribute("data-id")];
    var old = document.querySelector("#zukanMap .tile.target");
    if (old) old.classList.remove("target");
    g.classList.add("target");
    document.getElementById("zukanSay").innerHTML =
      "<b>" + p.full + "</b>（" + p.kanji + "）<br>" + REGIONS[p.region].full;
    beep("ok");
  });
  document.getElementById("zukanBack").addEventListener("click", function () {
    renderHome(); show("scrHome");
  });

  /* ---- ゲーム ---- */
  var game = null;
  document.querySelector(".modes").addEventListener("click", function (e) {
    var b = e.target.closest(".modebtn"); if (!b) return;
    var mode = b.getAttribute("data-mode");
    if (mode === "zukan") { openZukan(); return; }
    if (!isOpen(mode)) {
      document.getElementById("homeSay").textContent =
        "「" + LOCK_HINT[mode] + "」で パーフェクト（ぜんぶ せいかい）を とると ひらくよ！";
      b.classList.remove("deny");
      void b.offsetWidth;
      b.classList.add("deny");
      setTimeout(function () { b.classList.remove("deny"); }, 350);
      return;
    }
    startGame(mode);
  });
  function startGame(mode) {
    game = { mode: mode, qs: makeSet(mode), idx: 0, correct: 0, start: Date.now(), busy: false };
    buildMap(document.getElementById("gameMap"), mode !== "chihou");
    document.getElementById("choices").style.display = mode === "namae" ? "" : "none";
    show("scrGame");
    renderQ(true);
  }
  document.getElementById("quitBtn").addEventListener("click", function () {
    game = null; renderHome(); show("scrHome");
  });

  function clearTileMarks() {
    document.querySelectorAll("#gameMap .tile").forEach(function (t) {
      t.classList.remove("target", "reveal", "gotit", "dim");
    });
  }
  function renderQ(pop) {
    var q = game.qs[game.idx];
    document.getElementById("prog").textContent = (game.idx + 1) + " / " + N_Q;
    var stars = ""; for (var i = 0; i < game.correct; i++) stars += "⭐";
    document.getElementById("gameStars").textContent = stars;
    clearTileMarks();
    var qt = document.getElementById("qtext");
    if (q.kind === "region") {
      qt.innerHTML = "<b>" + REGIONS[q.target].full + "</b>は どこ？（どこか 1つ タップ）";
    } else if (q.kind === "find") {
      qt.innerHTML = "<b>" + BYID[q.target].full + "</b>は どこ？";
    } else {
      qt.innerHTML = "ひかっている けんは どこ？";
      document.querySelector('#gameMap .tile[data-id="' + q.target + '"]').classList.add("target");
      var ch = document.getElementById("choices");
      ch.innerHTML = "";
      q.choices.forEach(function (pid) {
        var b = document.createElement("button");
        b.className = "choicebtn"; b.textContent = BYID[pid].full;
        b.setAttribute("data-pick", pid);
        ch.appendChild(b);
      });
    }
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").className = "feedback";
    var bar = document.getElementById("qbar");
    bar.className = "qbar" + (pop ? " pop" : "");
    if (pop) setTimeout(function () { bar.className = "qbar"; }, 260);
  }

  function judge(ok, revealIds, okText, ngText) {
    var bar = document.getElementById("qbar");
    var fb = document.getElementById("feedback");
    game.busy = true;
    if (ok) {
      game.correct++;
      beep("ok");
      bar.className = "qbar right";
      fb.textContent = okText || "せいかい！";
      fb.className = "feedback ok";
      var s = document.createElement("span"); s.className = "flystar"; s.textContent = "⭐";
      bar.appendChild(s);
      setTimeout(next, 700);
    } else {
      beep("ng");
      bar.className = "qbar wrong";
      fb.textContent = ngText;
      fb.className = "feedback ng";
      revealIds.forEach(function (pid) {
        var t = document.querySelector('#gameMap .tile[data-id="' + pid + '"]');
        if (t) t.classList.add("reveal");
      });
      setTimeout(next, 1800);
    }
  }
  document.getElementById("gameMap").addEventListener("click", function (e) {
    if (!game || game.busy) return;
    var g = e.target.closest ? e.target.closest(".tile") : null;
    if (!g) return;
    var q = game.qs[game.idx];
    var p = BYID[g.getAttribute("data-id")];
    if (q.kind === "region") {
      var ok = p.region === q.target;
      var regionIds = PREFS.filter(function (x) { return x.region === q.target; }).map(function (x) { return x.id; });
      if (ok) {
        regionIds.forEach(function (pid) {
          document.querySelector('#gameMap .tile[data-id="' + pid + '"]').classList.add("gotit");
        });
      }
      judge(ok, regionIds, "せいかい！ ここが " + REGIONS[q.target].name + "だよ",
        "ここは " + REGIONS[p.region].name + "。" + REGIONS[q.target].name + "は ひかった ところだよ");
    } else if (q.kind === "find") {
      var ok2 = p.id === q.target;
      if (ok2) g.classList.add("gotit");
      judge(ok2, [q.target], "せいかい！",
        "そこは " + p.full + "。こたえは ひかった ところだよ");
    }
  });
  document.getElementById("choices").addEventListener("click", function (e) {
    if (!game || game.busy) return;
    var b = e.target.closest(".choicebtn"); if (!b) return;
    var q = game.qs[game.idx];
    var pick = b.getAttribute("data-pick");
    judge(pick === q.target, [q.target], "せいかい！ " + BYID[q.target].full + "だよ",
      "こたえは " + BYID[q.target].full + " だよ");
  });
  function next() {
    game.busy = false;
    game.idx++;
    if (game.idx >= N_Q) { finish(); return; }
    renderQ(true);
  }

  /* ---- けっか ---- */
  function finish() {
    var timeMs = Date.now() - game.start;
    var stars = ""; for (var i = 0; i < game.correct; i++) stars += "⭐";
    document.getElementById("rstars").textContent = stars || "…";
    document.getElementById("rmsg").textContent = game.correct + "もん せいかい！";
    document.getElementById("rtime").textContent = MODES[game.mode] + "・" + fmtTime(timeMs);

    var prev = data.best[game.mode];
    var isBest = !prev || game.correct > prev.correct ||
      (game.correct === prev.correct && timeMs < prev.timeMs);
    if (isBest) { data.best[game.mode] = { correct: game.correct, timeMs: timeMs }; saveData(); }
    document.getElementById("bestBadge").className = "bestbadge" + (isBest ? " show" : "");

    var unlockedName = "";
    if (game.correct === N_Q) {
      var nx = UNLOCK_NEXT[game.mode];
      if (nx && !isOpen(nx)) { data.unlocked[nx] = true; saveData(); unlockedName = MODES[nx]; }
    }
    var ub = document.getElementById("unlockBadge");
    ub.textContent = unlockedName ? "🔓 「" + unlockedName + "」が あそべるように なったよ！" : "";
    ub.className = "unlockbadge" + (unlockedName ? " show" : "");

    var say;
    if (game.correct === N_Q) { say = "パーフェクト！！ ちずはかせ！！"; beep("fanfare"); }
    else if (game.correct >= 8) say = "すごい！ あと ちょっとで パーフェクト！";
    else if (game.correct >= 5) say = "いいちょうし！ もういっかい やってみる？";
    else say = "だいじょうぶ、ずかんで みてから もういっかい♪";
    document.getElementById("rsay").textContent = say;

    var last = game.mode;
    document.getElementById("againBtn").onclick = function () { startGame(last); };
    show("scrResult");
  }
  document.getElementById("homeBtn").addEventListener("click", function () {
    renderHome(); show("scrHome");
  });

  renderHome();
})();
</script>
