<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>シールちょう デコ</title>
<style>
  :root{
    --kami:#FFFDF7; --moji:#5B4A3F;
    --momo:#F6C6CF; --sora:#BFDCEF; --wakaba:#CBE3C2; --tanpopo:#F9E2A9; --fuji:#D8CCEA;
    --mori:#5E9C56; --fukamori:#2F6B44; --orange:#E08A3C; --chairo:#B5722F; --cream:#F5E6C8;
    --font: 'UD デジタル 教科書体 NP-R','UDデジタル教科書体','Hiragino Maru Gothic ProN','BIZ UDGothic','Yu Gothic UI',sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:var(--font); color:var(--moji);
    background:
      radial-gradient(circle at 12% 18%, #fff6df 0 12px, transparent 13px),
      radial-gradient(circle at 88% 30%, #ffe7ec 0 10px, transparent 11px),
      radial-gradient(circle at 20% 82%, #dff0d6 0 11px, transparent 12px),
      radial-gradient(circle at 80% 88%, #e6def2 0 10px, transparent 11px),
      var(--cream);
    overflow:hidden; touch-action:manipulation;
  }
  .app{ display:flex; flex-direction:column; height:100dvh; }

  header{ display:flex; align-items:center; gap:10px; padding:7px 12px; background:var(--kami); border-bottom:4px dotted #f0e2c8; box-shadow:0 3px 0 #f4ecd9; }
  .neko{ width:44px; height:44px; flex:0 0 auto; }
  .title{ display:flex; flex-direction:column; line-height:1.15; }
  .title b{ font-size:21px; letter-spacing:.02em; }
  .title span{ font-size:11px; color:var(--chairo); }
  .head-btns{ margin-left:auto; display:flex; gap:7px; }
  button{ font-family:var(--font); cursor:pointer; }
  .hbtn{ border:none; border-radius:16px; padding:9px 12px; font-size:14px; font-weight:700; color:#fff; min-height:44px; box-shadow:0 3px 0 rgba(0,0,0,.12); transition:transform .05s; }
  .hbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
  .hbtn.hozon{ background:var(--mori); } .hbtn.modosu{ background:var(--sora); color:var(--moji); } .hbtn.keshi{ background:var(--momo); color:var(--moji); }

  .stage{ flex:1 1 auto; position:relative; display:flex; align-items:center; justify-content:center; padding:8px; min-height:0; }
  .page{ position:relative; width:min(94vw, 52dvh); aspect-ratio:3/4; background:var(--kami); border-radius:26px; box-shadow:0 10px 24px rgba(120,90,50,.18), inset 0 0 0 6px #fff; outline:5px solid #f0e2c8; overflow:hidden; touch-action:none; }
  .scene{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:none; }
  .page::before{ content:""; position:absolute; left:12px; top:12%; bottom:12%; width:4px; z-index:2; background:repeating-linear-gradient(#e7d6b4 0 6px, transparent 6px 22px); border-radius:4px; opacity:.55; }
  .sticker{ position:absolute; left:50%; top:50%; font-size:46px; line-height:1; transform:translate(-50%,-50%); transform-origin:center; cursor:grab; user-select:none; touch-action:none; will-change:transform,left,top;
    filter: drop-shadow(1px 1px 0 #fff) drop-shadow(-1px -1px 0 #fff) drop-shadow(1px -1px 0 #fff) drop-shadow(-1px 1px 0 #fff) drop-shadow(0 3px 3px rgba(91,74,63,.28)); }
  .sticker svg{ display:block; }
  .sticker.sel{ outline:3px dashed var(--orange); outline-offset:6px; border-radius:12px; }
  .praise{ position:absolute; left:50%; bottom:8px; transform:translateX(-50%); z-index:3; background:#fff; color:var(--fukamori); font-size:14px; font-weight:700; padding:7px 16px; border-radius:999px; box-shadow:0 3px 8px rgba(0,0,0,.12); white-space:nowrap; pointer-events:none; }
  .hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; color:#c9b79a; font-size:16px; font-weight:700; text-align:center; padding:20px; pointer-events:none; line-height:1.7; }

  .selbar{ display:none; gap:8px; justify-content:center; flex-wrap:wrap; padding:7px 10px; background:#fff7e6; border-top:3px dotted #f0e2c8; }
  .selbar.on{ display:flex; }
  .sbtn{ border:none; border-radius:16px; min-width:58px; min-height:48px; font-size:20px; font-weight:700; background:var(--kami); color:var(--moji); box-shadow:0 3px 0 #e7d6b4; display:flex; flex-direction:column; align-items:center; gap:1px; }
  .sbtn small{ font-size:11px; } .sbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #e7d6b4; } .sbtn.del{ background:var(--momo); }

  .palette{ background:var(--kami); border-top:4px dotted #f0e2c8; padding:6px 10px 10px; }
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:5px; }
  .tab{ border:none; border-radius:14px 14px 6px 6px; padding:8px 12px; min-height:44px; font-size:15px; font-weight:700; background:#f1e7d4; color:var(--chairo); white-space:nowrap; display:flex; align-items:center; }
  .tab.on{ background:var(--tanpopo); color:var(--moji); box-shadow:inset 0 -3px 0 var(--orange); }
  .stickers{ display:flex; gap:4px; overflow-x:auto; padding:5px 2px; min-height:60px; align-items:center; }
  .pbtn{ flex:0 0 auto; border:none; background:transparent; font-size:34px; line-height:1; width:54px; height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .pbtn:active{ background:#fdf1d6; transform:scale(.9); }
  .pbtn svg{ width:44px; height:44px; }

  .row{ display:flex; align-items:center; gap:8px; margin-top:7px; flex-wrap:wrap; }
  .rlabel{ font-size:13px; color:var(--chairo); font-weight:700; flex:0 0 auto; }
  .scenes{ display:flex; gap:6px; overflow-x:auto; }
  .scenebtn{ flex:0 0 auto; border:none; border-radius:16px; min-width:58px; min-height:56px; padding:5px 6px; background:#f1e7d4; color:var(--chairo); font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .scenebtn b{ font-size:22px; font-weight:400; line-height:1; } .scenebtn.on{ background:var(--cream); box-shadow:0 0 0 3px var(--orange); color:var(--moji); }
  .swatches{ display:flex; gap:2px; }
  .sw{ width:44px; height:44px; border:none; background:transparent; border-radius:50%; display:grid; place-items:center; }
  .sw i{ width:32px; height:32px; border-radius:50%; display:block; box-shadow:0 0 0 2px #eadfc8, inset 0 0 0 3px #fff; }
  .sw.on i{ box-shadow:0 0 0 3px var(--orange), inset 0 0 0 3px #fff; }
  .patbtn{ border:none; border-radius:12px; padding:8px 10px; min-height:44px; font-size:13px; font-weight:700; background:#f1e7d4; color:var(--chairo); }
  .patbtn.on{ background:var(--wakaba); color:var(--moji); } .patbtn.disabled{ opacity:.35; pointer-events:none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="neko" id="nekoHead" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div class="title"><b>シールちょう デコ</b><span>ばしょを えらんで おままごと しよう</span></div>
    <div class="head-btns">
      <button class="hbtn modosu" id="undo">↩ もどす</button>
      <button class="hbtn keshi" id="clear">🧹 ぜんぶ</button>
      <button class="hbtn hozon" id="save">📷 ほぞん</button>
    </div>
  </header>

  <div class="stage">
    <div class="page" id="page">
      <svg class="scene" id="scene" viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="hint" id="hint">「ばしょ」を えらんで<br>したの シールを タップ！<br>ゆびで つまむと おおきさが かわるよ ✨</div>
      <div class="praise" id="praise">すきな ばしょを えらんでね！</div>
    </div>
  </div>

  <div class="selbar" id="selbar">
    <button class="sbtn" data-act="big">🔍<small>おおきく</small></button>
    <button class="sbtn" data-act="small">🔎<small>ちいさく</small></button>
    <button class="sbtn" data-act="rotate">↻<small>まわす</small></button>
    <button class="sbtn" data-act="front">⬆<small>まえへ</small></button>
    <button class="sbtn del" data-act="del">🗑<small>けす</small></button>
  </div>

  <div class="palette">
    <div class="tabs" id="tabs"></div>
    <div class="stickers" id="stickers"></div>
    <div class="row"><span class="rlabel">ばしょ</span><div class="scenes" id="scenes"></div></div>
    <div class="row">
      <span class="rlabel">かみのいろ</span><div class="swatches" id="swatches"></div>
      <span class="rlabel">もよう</span>
      <button class="patbtn on" data-pat="none">なし</button>
      <button class="patbtn" data-pat="dot">みずたま</button>
      <button class="patbtn" data-pat="stripe">しましま</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const BASE = 46;
  const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));

  /* ===== 白猫ちゃん ===== */
  const NEKO = `
    <ellipse cx="50" cy="88" rx="26" ry="7" fill="#efe3c9"/>
    <path d="M28 40 L20 20 L40 34 Z" fill="#fff" stroke="#e6d8bf" stroke-width="2"/><path d="M72 40 L80 20 L60 34 Z" fill="#fff" stroke="#e6d8bf" stroke-width="2"/>
    <path d="M30 24 L26 34 L36 30 Z" fill="#F6C6CF"/><path d="M70 24 L74 34 L64 30 Z" fill="#F6C6CF"/>
    <circle cx="50" cy="54" r="30" fill="#fff" stroke="#e6d8bf" stroke-width="2"/>
    <circle cx="40" cy="52" r="4.2" fill="#5B4A3F"/><circle cx="60" cy="52" r="4.2" fill="#5B4A3F"/>
    <circle cx="41.5" cy="50.5" r="1.3" fill="#fff"/><circle cx="61.5" cy="50.5" r="1.3" fill="#fff"/>
    <ellipse cx="33" cy="60" rx="5" ry="3.5" fill="#F6C6CF" opacity=".8"/><ellipse cx="67" cy="60" rx="5" ry="3.5" fill="#F6C6CF" opacity=".8"/>
    <path d="M47 59 Q50 62 53 59" fill="none" stroke="#B5722F" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 61 Q46 66 42 64 M50 61 Q54 66 58 64" fill="none" stroke="#5B4A3F" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 56 h10 M20 62 h12 M68 56 h10 M68 62 h12" stroke="#e6d8bf" stroke-width="1.6" stroke-linecap="round"/>`;
  document.getElementById('nekoHead').innerHTML = NEKO;

  /* ===== 全身のおままごと人形（SVG・viewBox 100x100） ===== */
  function person(o){
    const skin=o.skin||'#F6D2B8', hair=o.hair||'#7a5236', cl=o.clothes||'#F6C6CF', line='#B5722F';
    const H={
      short:`<path d="M32 32 Q33 12 50 12 Q67 12 68 32 Q60 21 50 21 Q40 21 32 32 Z" fill="${hair}"/>`,
      long:`<path d="M30 34 Q29 11 50 10 Q71 11 70 34 L67 60 Q61 50 63 34 Q57 22 50 22 Q43 22 37 34 Q39 50 33 60 Z" fill="${hair}"/>`,
      twin:`<path d="M32 32 Q33 12 50 12 Q67 12 68 32 Q60 21 50 21 Q40 21 32 32 Z" fill="${hair}"/><circle cx="29" cy="36" r="8" fill="${hair}"/><circle cx="71" cy="36" r="8" fill="${hair}"/>`,
      bun:`<path d="M33 32 Q34 15 50 15 Q66 15 67 32 Q59 23 50 23 Q41 23 33 32 Z" fill="${hair}"/><circle cx="50" cy="12" r="8" fill="${hair}"/>`,
    };
    if(o.baby){
      return `<ellipse cx="50" cy="70" rx="21" ry="19" fill="${cl}" stroke="${line}" stroke-width="2"/>
        <circle cx="38" cy="80" r="6" fill="${skin}"/><circle cx="62" cy="80" r="6" fill="${skin}"/>
        <circle cx="50" cy="42" r="17" fill="${skin}" stroke="${line}" stroke-width="1.5"/>
        <path d="M44 27 q5 -6 8 2" fill="none" stroke="${hair}" stroke-width="3" stroke-linecap="round"/>
        <circle cx="44" cy="43" r="2.2" fill="#5B4A3F"/><circle cx="56" cy="43" r="2.2" fill="#5B4A3F"/>
        <ellipse cx="40" cy="48" rx="3" ry="2" fill="#F6C6CF" opacity=".8"/><ellipse cx="60" cy="48" rx="3" ry="2" fill="#F6C6CF" opacity=".8"/>
        <path d="M46 49 Q50 53 54 49" fill="none" stroke="#B5722F" stroke-width="1.6" stroke-linecap="round"/>`;
    }
    const legs = o.dress ? `<rect x="44" y="80" width="5" height="10" rx="2" fill="${skin}"/><rect x="51" y="80" width="5" height="10" rx="2" fill="${skin}"/>` : '';
    const shoes = `<ellipse cx="46" cy="91" rx="6" ry="3.5" fill="#7a5a44"/><ellipse cx="54" cy="91" rx="6" ry="3.5" fill="#7a5a44"/>`;
    const body = o.dress
      ? `<path d="M37 46 Q50 40 63 46 L71 82 Q50 90 29 82 Z" fill="${cl}" stroke="${line}" stroke-width="2"/>`
      : `<rect x="37" y="46" width="26" height="26" rx="9" fill="${cl}" stroke="${line}" stroke-width="2"/><rect x="41" y="68" width="7" height="18" rx="3" fill="${o.pants||'#8aa0c8'}"/><rect x="52" y="68" width="7" height="18" rx="3" fill="${o.pants||'#8aa0c8'}"/>`;
    const arms = `<rect x="28" y="48" width="6" height="22" rx="3" fill="${cl}" stroke="${line}" stroke-width="1.4"/><rect x="66" y="48" width="6" height="22" rx="3" fill="${cl}" stroke="${line}" stroke-width="1.4"/><circle cx="31" cy="71" r="4" fill="${skin}"/><circle cx="69" cy="71" r="4" fill="${skin}"/>`;
    const head = `<circle cx="50" cy="31" r="16" fill="${skin}" stroke="${line}" stroke-width="1.5"/>`;
    const face = `<circle cx="44" cy="32" r="2.2" fill="#5B4A3F"/><circle cx="56" cy="32" r="2.2" fill="#5B4A3F"/><ellipse cx="40" cy="37" rx="3" ry="2" fill="#F6C6CF" opacity=".7"/><ellipse cx="60" cy="37" rx="3" ry="2" fill="#F6C6CF" opacity=".7"/><path d="M46 38 Q50 42 54 38" fill="none" stroke="#B5722F" stroke-width="1.6" stroke-linecap="round"/>`;
    const glasses = o.glasses ? `<circle cx="44" cy="32" r="5" fill="none" stroke="#5B4A3F" stroke-width="1.4"/><circle cx="56" cy="32" r="5" fill="none" stroke="#5B4A3F" stroke-width="1.4"/><path d="M49 32 H51" stroke="#5B4A3F" stroke-width="1.4"/>` : '';
    return `${legs}${shoes}${body}${arms}${head}${H[o.hairStyle]||H.short}${face}${glasses}`;
  }
  const PEOPLE = {
    'p_mama':   person({dress:true,  hair:'#7a5236', hairStyle:'long', clothes:'#F6C6CF'}),
    'p_papa':   person({dress:false, hair:'#4a3a2a', hairStyle:'short', clothes:'#BFDCEF', pants:'#7c9070'}),
    'p_girl':   person({dress:true,  hair:'#8a5a36', hairStyle:'twin', clothes:'#F9E2A9'}),
    'p_boy':    person({dress:false, hair:'#3a2a1a', hairStyle:'short', clothes:'#CBE3C2', pants:'#B5722F'}),
    'p_baby':   person({baby:true,   hair:'#8a5a36', clothes:'#D8CCEA'}),
    'p_grandma':person({dress:true,  hair:'#cfc6bd', hairStyle:'bun', clothes:'#D8CCEA', glasses:true}),
    'p_grandpa':person({dress:false, hair:'#cfc6bd', hairStyle:'short', clothes:'#EAD08F', pants:'#8a7a63', glasses:true}),
  };
  /* ===== 絵本タッチの家具・どうぐ（SVG・viewBox 100x100） ===== */
  const FURNITURE = {
    'f_sofa': `<g stroke="#B5722F" stroke-width="2.5" stroke-linejoin="round"><rect x="16" y="26" width="68" height="30" rx="13" fill="#F6C6CF"/><rect x="8" y="40" width="16" height="26" rx="8" fill="#F6C6CF"/><rect x="76" y="40" width="16" height="26" rx="8" fill="#F6C6CF"/><rect x="22" y="48" width="56" height="16" rx="8" fill="#F5E6C8"/></g><rect x="22" y="66" width="7" height="10" rx="3" fill="#B5722F"/><rect x="71" y="66" width="7" height="10" rx="3" fill="#B5722F"/><circle cx="38" cy="38" r="2.2" fill="#E8A8B8"/><circle cx="62" cy="38" r="2.2" fill="#E8A8B8"/>`,
    'f_bed': `<rect x="14" y="72" width="7" height="9" rx="3" fill="#B5722F"/><rect x="79" y="72" width="7" height="9" rx="3" fill="#B5722F"/><g stroke="#B5722F" stroke-width="2.5" stroke-linejoin="round"><rect x="8" y="26" width="16" height="46" rx="7" fill="#E7C89B"/><rect x="76" y="36" width="16" height="36" rx="7" fill="#E7C89B"/><rect x="16" y="46" width="68" height="18" rx="7" fill="#F5E6C8"/><path d="M42 46 H84 V58 Q80 66 74 60 Q68 68 60 60 Q52 68 46 60 L42 58 Z" fill="#F6C6CF"/><ellipse cx="30" cy="42" rx="11" ry="7" fill="#BFDCEF"/></g>`,
    'f_chair': `<rect x="30" y="63" width="7" height="25" rx="3" fill="#B5722F"/><rect x="64" y="63" width="7" height="25" rx="3" fill="#B5722F"/><g stroke="#B5722F" stroke-width="2.5" stroke-linejoin="round"><rect x="28" y="10" width="11" height="50" rx="5" fill="#E7C89B"/><rect x="26" y="52" width="50" height="11" rx="5" fill="#E7C89B"/><ellipse cx="54" cy="52" rx="18" ry="6" fill="#F9E2A9"/></g><circle cx="33" cy="14" r="3.5" fill="#F6C6CF"/>`,
    'f_table': `<rect x="28" y="64" width="7" height="22" rx="3" fill="#B5722F"/><rect x="65" y="64" width="7" height="22" rx="3" fill="#B5722F"/><g stroke="#B5722F" stroke-width="2.5" stroke-linejoin="round"><path d="M12 46 L16 60 Q50 76 84 60 L88 46 Z" fill="#F6C6CF"/><ellipse cx="50" cy="44" rx="38" ry="13" fill="#F5E6C8"/></g><ellipse cx="50" cy="44" rx="29" ry="8.5" fill="none" stroke="#F6C6CF" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="50" cy="41" r="5" fill="#F9E2A9" stroke="#B5722F" stroke-width="2"/>`,
    'f_door': `<rect x="26" y="8" width="48" height="82" rx="10" fill="#E08A3C" stroke="#B5722F" stroke-width="2.5"/><rect x="34" y="18" width="32" height="24" rx="6" fill="#F5E6C8" opacity=".9"/><rect x="34" y="50" width="32" height="24" rx="6" fill="#F5E6C8" opacity=".9"/><circle cx="66" cy="48" r="4.5" fill="#F9E2A9" stroke="#B5722F" stroke-width="2"/>`,
    'f_window': `<path d="M16 22 Q34 42 50 26 Q66 42 84 22 L84 12 L16 12 Z" fill="#F6C6CF" stroke="#B5722F" stroke-width="2"/><rect x="22" y="24" width="56" height="52" rx="10" fill="#BFDCEF" stroke="#E08A3C" stroke-width="4.5"/><path d="M50 26 V74 M24 50 H76" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="16" y="78" width="68" height="9" rx="4" fill="#E7C89B" stroke="#B5722F" stroke-width="2"/><path d="M64 78 l2 -9 h8 l2 9 z" fill="#B5722F"/><circle cx="70" cy="64" r="4.5" fill="#F6C6CF"/><circle cx="70" cy="64" r="1.8" fill="#F9E2A9"/>`,
    'f_bath': `<rect x="22" y="80" width="8" height="8" rx="3" fill="#B5722F"/><rect x="70" y="80" width="8" height="8" rx="3" fill="#B5722F"/><path d="M10 44 Q10 78 34 80 H66 Q90 78 90 44 Z" fill="#FFFDF7" stroke="#B5722F" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="50" cy="46" rx="36" ry="8" fill="#BFDCEF"/><circle cx="62" cy="40" r="6" fill="#F9E2A9" stroke="#B5722F" stroke-width="1.5"/><circle cx="68" cy="35" r="4" fill="#F9E2A9" stroke="#B5722F" stroke-width="1.5"/><path d="M72 35 l5 1 -5 2 Z" fill="#E08A3C"/><circle cx="28" cy="30" r="4" fill="#BFDCEF" opacity=".7"/><circle cx="36" cy="24" r="3" fill="#BFDCEF" opacity=".6"/><circle cx="24" cy="21" r="2.5" fill="#BFDCEF" opacity=".5"/>`,

  function earOval(cx,cy,rx,ry,rot,fill,dark,innerFill,innerScale){
    let s=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${dark}" stroke-width="2" transform="rotate(${rot} ${cx} ${cy})"/>`;
    if(innerFill) s+=`<ellipse cx="${cx}" cy="${cy}" rx="${(rx*innerScale).toFixed(1)}" ry="${(ry*innerScale).toFixed(1)}" fill="${innerFill}" transform="rotate(${rot} ${cx} ${cy})"/>`;
    return s;
  }

  function chibiHead(color,dark,r){ return `<circle cx="50" cy="36" r="${r||22}" fill="${color}" stroke="${dark}" stroke-width="2"/>`; }
  function chibiFace(y,sp){
    const x1=50-(sp||9), x2=50+(sp||9);
    return `<circle cx="${x1}" cy="${y}" r="2.4" fill="#5B4A3F"/><circle cx="${x2}" cy="${y}" r="2.4" fill="#5B4A3F"/><ellipse cx="${x1-4}" cy="${y+5}" rx="3" ry="2" fill="#F6C6CF" opacity=".7"/><ellipse cx="${x2+4}" cy="${y+5}" rx="3" ry="2" fill="#F6C6CF" opacity=".7"/><path d="M${x1+2} ${y+8} Q50 ${y+12} ${x2-2} ${y+8}" fill="none" stroke="#B5722F" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  function starShape(color,cx,cy,rOuter,rInner){
    cx=cx||50; cy=cy||54; rOuter=rOuter||32; rInner=rInner||13;
    let d='',rot=-Math.PI/2; const step=Math.PI/5;
    for(let i=0;i<5;i++){
      let x=cx+Math.cos(rot)*rOuter, y=cy+Math.sin(rot)*rOuter;
      d+=(i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' '; rot+=step;
      x=cx+Math.cos(rot)*rInner; y=cy+Math.sin(rot)*rInner;
      d+='L'+x.toFixed(1)+' '+y.toFixed(1)+' '; rot+=step;
    }
    return `<path d="${d}Z" fill="${color}" stroke="#B5722F" stroke-width="2.2" stroke-linejoin="round"/>`;
  }

    return `${petals}<circle cx="50" cy="50" r="11" fill="${centerColor}" stroke="#B5722F" stroke-width="1.6"/>`;

  function sceneOniwa(){

  const SCENES = { 'いえ':sceneIe(), 'おみせ':sceneOmise(), 'こうえん':sceneKouen(), 'パーティ':sceneParty(), 'おにわ':sceneOniwa() };
  const SCENE_LIST = [ {key:'none',icon:'🚫',label:'むじ'},{key:'いえ',icon:'🏠',label:'いえ'},{key:'おみせ',icon:'🍽️',label:'おみせ'},{key:'こうえん',icon:'🏞️',label:'こうえん'},{key:'パーティ',icon:'🎉',label:'パーティ'},{key:'おにわ',icon:'🌷',label:'おにわ'} ];
  const SCENE_PRAISE = {'いえ':'おうちに しよう！','おみせ':'レストランへ！','こうえん':'こうえんで あそぼ！','パーティ':'パーティ たのしい！','おにわ':'おにわ すてき！','none':'むじの ページ！'};

  /* ===== じょうたい ===== */
  let stickers=[], selId=null, seq=1, bgColor='#FFFDF7', bgPat='none', scene='none';
  const page=document.getElementById('page'), sceneEl=document.getElementById('scene'), hint=document.getElementById('hint'), praise=document.getElementById('praise'), selbar=document.getElementById('selbar');

  function applyBg(){
    if(scene!=='none'){ sceneEl.innerHTML=SCENES[scene]; sceneEl.style.display='block'; page.style.background='#FFFDF7'; page.style.backgroundImage='none'; }
    else{
      sceneEl.style.display='none'; page.style.background=bgColor;
      if(bgPat==='dot'){ page.style.backgroundImage='radial-gradient(rgba(255,255,255,.75) 4px, transparent 5px)'; page.style.backgroundSize='30px 30px'; }
      else if(bgPat==='stripe'){ page.style.backgroundImage='repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 12px, transparent 12px 26px)'; page.style.backgroundSize='auto'; }
      else page.style.backgroundImage='none';
    }
    document.querySelectorAll('.patbtn').forEach(p=>p.classList.toggle('disabled', scene!=='none'));
  }
  function renderOne(s){
    let el=document.getElementById(s.id);
    if(!el){
      el=document.createElement('div'); el.className='sticker'; el.id=s.id;
      if(SVG_STICKERS[s.emoji]) el.innerHTML=svgWrap(SVG_STICKERS[s.emoji],BASE); else el.textContent=s.emoji;
      if(s.base){ const first=page.querySelector('.sticker'); first?page.insertBefore(el,first):page.appendChild(el); } else page.appendChild(el);
    }
    el.style.left=(s.fx*100)+'%'; el.style.top=(s.fy*100)+'%';
    el.style.transform=`translate(-50%,-50%) rotate(${s.rot}deg) scale(${s.scale})`;
    el.classList.toggle('sel', s.id===selId);
  }
  function renderAll(){ [...page.querySelectorAll('.sticker')].forEach(e=>e.remove()); stickers.forEach(renderOne); refreshUI(); }
  function refreshUI(){ hint.style.display=stickers.length?'none':'flex'; selbar.classList.toggle('on', !!selId); }
  function sel(id){ selId=id; stickers.forEach(s=>document.getElementById(s.id)?.classList.toggle('sel', s.id===selId)); refreshUI(); }
  function find(id){ return stickers.find(s=>s.id===id); }

  function addSticker(emoji, tab){
    const id='st'+(seq++), base=BASE_TABS.includes(tab);
    const j=()=>0.5+(Math.random()-0.5)*0.16;
    const s={id, emoji, fx:j(), fy:base?0.5:j(), scale:base?BASE_SCALE:1, rot:(Math.random()*16-8), base};
    stickers.push(s); renderOne(s); sel(id);
    if(!base){ const el=document.getElementById(id); page.appendChild(el); }
    praise.textContent=PRAISES[Math.floor(Math.random()*PRAISES.length)]; save();
  }

  /* ===== ゆびそうさ（ドラッグ＋ピンチで拡大・回転） ===== */
  const pts=new Map(); let pinch=null, moved=false;
  function setPinchBase(){ const s=find(selId); if(!s||pts.size<2){ pinch=null; return; } const v=[...pts.values()],p1=v[0],p2=v[1]; pinch={ dist:Math.hypot(p1.x-p2.x,p1.y-p2.y)||1, ang:Math.atan2(p2.y-p1.y,p2.x-p1.x), scale:s.scale, rot:s.rot }; }
  page.addEventListener('pointerdown', e=>{
    const stEl=e.target.closest('.sticker');
    if(stEl){
      sel(stEl.id); const s=find(stEl.id); if(s && !s.base) page.appendChild(stEl);
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); page.setPointerCapture(e.pointerId);
      if(pts.size>=2) setPinchBase(); e.preventDefault();
    }else if(selId && pts.size>=1){
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); page.setPointerCapture(e.pointerId); setPinchBase(); e.preventDefault();
    }else sel(null);
  });
  page.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const s=find(selId); if(!s) return; const r=page.getBoundingClientRect();
    if(pts.size>=2){
      const v=[...pts.values()],p1=v[0],p2=v[1];
      const dist=Math.hypot(p1.x-p2.x,p1.y-p2.y), ang=Math.atan2(p2.y-p1.y,p2.x-p1.x);
      if(pinch){ s.scale=clamp(pinch.scale*(dist/pinch.dist),0.3,6); s.rot=pinch.rot+(ang-pinch.ang)*180/Math.PI; }
    }else{
      s.fx=clamp((e.clientX-r.left)/r.width,0.04,0.96); s.fy=clamp((e.clientY-r.top)/r.height,0.04,0.96);
    }
    moved=true; renderOne(s);
  });
  function up(e){ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(pts.size>=2) setPinchBase(); if(moved) save(); if(pts.size===0) moved=false; }
  page.addEventListener('pointerup',up); page.addEventListener('pointercancel',up);

  /* ===== そうさバー ===== */
  selbar.addEventListener('click', e=>{
    const b=e.target.closest('.sbtn'); if(!b||!selId) return; const s=find(selId); if(!s) return; const a=b.dataset.act;
    if(a==='big')    s.scale=clamp(s.scale+0.3,0.3,6);
    if(a==='small')  s.scale=clamp(s.scale-0.3,0.3,6);
    if(a==='rotate') s.rot=(s.rot+15)%360;
    if(a==='front'){ page.appendChild(document.getElementById(s.id)); s.base=false; }
    if(a==='del'){ stickers=stickers.filter(x=>x.id!==selId); document.getElementById(selId)?.remove(); selId=null; refreshUI(); save(); return; }
    renderOne(s); save();
  });

  document.getElementById('undo').onclick=()=>{ const s=stickers.pop(); if(!s) return; document.getElementById(s.id)?.remove(); if(selId===s.id) selId=null; refreshUI(); save(); };
  document.getElementById('clear').onclick=()=>{ if(!stickers.length) return; if(confirm('シールを ぜんぶ けして いい？')){ stickers=[]; selId=null; renderAll(); save(); praise.textContent='まっさら！ また はろう 🌱'; } };
  document.getElementById('save').onclick=saveImage;

  /* ===== パレット UI ===== */
  const tabsEl=document.getElementById('tabs'), stickersEl=document.getElementById('stickers');
  Object.keys(SETS).forEach((name,i)=>{ const t=document.createElement('button'); t.className='tab'+(i===0?' on':''); t.textContent=name; t.onclick=()=>{ [...tabsEl.children].forEach(c=>c.classList.remove('on')); t.classList.add('on'); showSet(name); }; tabsEl.appendChild(t); });
  function showSet(name){
    stickersEl.innerHTML='';
    SETS[name].forEach(em=>{ const b=document.createElement('button'); b.className='pbtn'; if(SVG_STICKERS[em]) b.innerHTML=svgWrap(SVG_STICKERS[em],44); else b.textContent=em; b.onclick=()=>addSticker(em,name); stickersEl.appendChild(b); });
  }
  showSet(Object.keys(SETS)[0]);

  const scenesEl=document.getElementById('scenes');
  SCENE_LIST.forEach(sc=>{ const b=document.createElement('button'); b.className='scenebtn'+(sc.key===scene?' on':''); b.innerHTML=`<b>${sc.icon}</b>${sc.label}`; b.dataset.key=sc.key; b.onclick=()=>{ scene=sc.key; [...scenesEl.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); applyBg(); praise.textContent=SCENE_PRAISE[sc.key]; save(); }; scenesEl.appendChild(b); });

  const swEl=document.getElementById('swatches');
  BGCOLORS.forEach((bc,i)=>{ const b=document.createElement('button'); b.className='sw'+(i===0?' on':''); b.title=bc.name; b.innerHTML=`<i style="background:${bc.c}"></i>`; b.onclick=()=>{ [...swEl.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); bgColor=bc.c; if(scene==='none') applyBg(); save(); }; swEl.appendChild(b); });
  document.querySelectorAll('.patbtn').forEach(p=>{ p.onclick=()=>{ if(scene!=='none') return; document.querySelectorAll('.patbtn').forEach(x=>x.classList.remove('on')); p.classList.add('on'); bgPat=p.dataset.pat; applyBg(); save(); }; });

  /* ===== ほぞん（じどう） ===== */
  const KEY='sticker-book-v2';
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify({stickers,seq,bgColor,bgPat,scene})); }catch(_){} }
  function load(){
    try{ const d=JSON.parse(localStorage.getItem(KEY)); if(!d) return;
      stickers=d.stickers||[]; seq=d.seq||1; bgColor=d.bgColor||'#FFFDF7'; bgPat=d.bgPat||'none'; scene=d.scene||'none';
      const idx=BGCOLORS.findIndex(b=>b.c===bgColor); if(idx>=0){ [...swEl.children].forEach(c=>c.classList.remove('on')); swEl.children[idx]?.classList.add('on'); }
      document.querySelectorAll('.patbtn').forEach(x=>x.classList.toggle('on', x.dataset.pat===bgPat));
      [...scenesEl.children].forEach(c=>c.classList.toggle('on', c.dataset.key===scene));
    }catch(_){}
  }

  /* ===== がぞうに して ほぞん ===== */
  function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
  async function saveImage(){
    const r=page.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=r.width*sc; cv.height=r.height*sc;
    const ctx=cv.getContext('2d'); ctx.scale(sc,sc);
    if(scene!=='none'){
      try{ const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 300 400">${SCENES[scene]}</svg>`)); ctx.drawImage(img,0,0,r.width,r.height); }
      catch(_){ ctx.fillStyle='#FFFDF7'; ctx.fillRect(0,0,r.width,r.height); }
    }else{
      ctx.fillStyle=bgColor; ctx.fillRect(0,0,r.width,r.height);
      if(bgPat==='dot'){ ctx.fillStyle='rgba(255,255,255,.75)'; for(let y=15;y<r.height;y+=30) for(let x=15;x<r.width;x+=30){ ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); } }
      else if(bgPat==='stripe'){ ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=12; for(let d=-r.height; d<r.width; d+=26){ ctx.beginPath(); ctx.moveTo(d,0); ctx.lineTo(d+r.height,r.height); ctx.stroke(); } }
    }
    await Promise.all(Object.values(imgCache).map(im=> im.complete?null:loadImg(im.src).catch(()=>{})));
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // 画面の重なり順（DOM順＝奥→手前）どおりに描く。配列順だと あとから置いた家具が手前に来てしまう
    const ordered=[...page.querySelectorAll('.sticker')].map(el=>find(el.id)).filter(Boolean);
    ordered.forEach(s=>{
      ctx.save(); ctx.translate(s.fx*r.width, s.fy*r.height); ctx.rotate(s.rot*Math.PI/180); ctx.scale(s.scale,s.scale);
      ctx.shadowColor='rgba(91,74,63,.28)'; ctx.shadowBlur=3; ctx.shadowOffsetY=3;
      if(SVG_STICKERS[s.emoji]){ const im=imgCache[s.emoji]; if(im&&im.complete){ try{ ctx.drawImage(im,-BASE/2,-BASE/2,BASE,BASE); }catch(_){} } }
      else{ ctx.font=BASE+'px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.fillText(s.emoji,0,2); }
      ctx.restore();
    });
    try{ const a=document.createElement('a'); a.download='シールちょう.png'; a.href=cv.toDataURL('image/png'); a.click(); praise.textContent='ほぞんしたよ！ よく できました 💮'; }
    catch(_){ praise.textContent='スクショで ほぞんしてね 📷'; }
  }

  load(); applyBg(); renderAll();
})();
</script>
