<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<title>フラッシュけいさん できあい版</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<!-- ホーム画面アイコン（2026-08-05 追加。これが無いとホーム画面でカタカナの文字アイコンになる） -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5E6C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="けいさん">
<style>
  :root {
    --bg: #FFFDF7;
    --bg-deco: #F8EEDA;
    --card: #FFFFFF;
    --ink: #5B4A3F;
    --muted: #7E6A5A;
    --line: #E2D2B2;
    --ng-ink: #B94D64;
    --accent: #E08A3C;
    --accent-ink: #FFFFFF;
    --star: #FFCF5C;
    --good: #5E9C56;
    --bad: #E0798F;
    --bubble: #FBF3E0;
    --lock: #C9BCA9;
    --lock-ink: #6E5A45;
    --m-tashi: #E997AE;
    --m-hiki: #5E9C56;
    --m-maze: #E08A3C;
    --m-kazu: #A794CE;
    --shadow: 0 2px 4px rgba(181,114,47,.12), 0 6px 18px rgba(181,114,47,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #252B23; --bg-deco: #2C332A; --card: #333C30; --ink: #F2EBDC; --muted: #A9A18C;
      --line: #4A5340; --accent: #E89B55; --accent-ink: #2A2314; --star: #FFD97A; --ng-ink: #E893A5;
      --good: #85C07B; --bad: #E893A5; --bubble: #3A4435; --lock: #6B7261; --lock-ink: #C7BCA6;
      --m-tashi: #EFA9BE; --m-hiki: #85C07B; --m-maze: #ECA36A; --m-kazu: #BCA9E0;
      --shadow: 0 2px 6px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --bg: #FFFDF7; --bg-deco: #F8EEDA; --card: #FFFFFF; --ink: #5B4A3F; --muted: #7E6A5A;
    --line: #E2D2B2; --accent: #E08A3C; --accent-ink: #FFFFFF; --star: #FFCF5C; --ng-ink: #B94D64;
    --good: #5E9C56; --bad: #E0798F; --bubble: #FBF3E0; --lock: #C9BCA9; --lock-ink: #6E5A45;
    --m-tashi: #E997AE; --m-hiki: #5E9C56; --m-maze: #E08A3C; --m-kazu: #A794CE;
    --shadow: 0 2px 4px rgba(181,114,47,.12), 0 6px 18px rgba(181,114,47,.10);
  }
  :root[data-theme="dark"] {
    --bg: #252B23; --bg-deco: #2C332A; --card: #333C30; --ink: #F2EBDC; --muted: #A9A18C;
    --line: #4A5340; --accent: #E89B55; --accent-ink: #2A2314; --star: #FFD97A; --ng-ink: #E893A5;
    --good: #85C07B; --bad: #E893A5; --bubble: #3A4435; --lock: #6B7261; --lock-ink: #C7BCA6;
    --m-tashi: #EFA9BE; --m-hiki: #85C07B; --m-maze: #ECA36A; --m-kazu: #BCA9E0;
    --shadow: 0 2px 6px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    background-image:
      radial-gradient(ellipse 90px 46px at 12% 60px, var(--bg-deco) 55%, transparent 100%),
      radial-gradient(ellipse 120px 56px at 88% 130px, var(--bg-deco) 55%, transparent 100%),
      radial-gradient(ellipse 80px 40px at 30% 240px, var(--bg-deco) 55%, transparent 100%);
    background-repeat: no-repeat;
    font-family: "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R",
      "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Noto Sans JP",
      "Yu Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); min-height: 100%; display: flex; flex-direction: column; }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.show { display: flex; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- ホーム ---- */
  .homehead { text-align: center; margin: 8px 0 4px; position: relative; }
  .homehead h1 { font-size: 26px; margin: 0; letter-spacing: .06em; }
  .homehead .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .gearbtn {
    position: absolute; top: 0; right: 0;
    border: 2px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 999px; min-width: 44px; min-height: 44px; padding: 6px 12px;
    font-size: 14px; box-shadow: var(--shadow);
  }
  .cat { width: 110px; margin: 6px auto 2px; }
  @keyframes catbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .cat svg { animation: catbob 3.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .cat svg { animation: none; } }
  .homebubble {
    background: var(--bubble); border: 2px solid var(--line); border-radius: 16px;
    padding: 8px 14px; font-size: 15px; text-align: center; margin: 0 auto 14px; max-width: 300px;
  }
  .modes { display: flex; flex-direction: column; gap: 12px; }
  .modebtn {
    border: none; border-radius: 20px; padding: 16px 18px;
    background: var(--card); box-shadow: var(--shadow);
    border-left: 10px solid var(--mcolor);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 20px; color: var(--ink); text-align: left;
  }
  .modebtn { flex-wrap: wrap; }
  .modebtn .best { font-size: 14px; color: var(--muted); flex: 1 1 100%; margin-top: 4px; }
  .modebtn:active { transform: scale(.98); }
  .modebtn.locked { flex-wrap: wrap; border-left-color: var(--lock); box-shadow: none; background: var(--bg-deco); color: var(--lock-ink); }
  .modebtn.locked .best { flex: 1 1 100%; white-space: normal; line-height: 1.5; font-size: 14px; color: var(--lock-ink); }
  .modebtn.deny { animation: shake .3s ease; }
  @media (prefers-reduced-motion: reduce) { .modebtn.deny { animation: none; } }

  /* ---- ゲーム ---- */
  .gametop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .quit { border: 2px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 13px 18px; font-size: 14px; }
  .prog { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .gamestars { font-size: 15px; letter-spacing: 1px; min-height: 20px; text-align: center; }
  .qcard {
    background: var(--card); border: 2.5px solid var(--line); border-radius: 24px;
    box-shadow: var(--shadow); padding: 20px 14px; text-align: center; margin: 6px 0 12px;
    min-height: 128px; display: flex; flex-direction: column; justify-content: center; gap: 6px;
    position: relative; overflow: hidden;
  }
  @keyframes qpop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .qcard.pop .qtext { animation: qpop .22s ease-out; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .qcard.wrong { animation: shake .3s ease; border-color: var(--bad); }
  .qcard.right { border-color: var(--good); }
  @media (prefers-reduced-motion: reduce) { .qcard.pop .qtext, .qcard.wrong { animation: none; } }
  .qtext { font-size: 44px; font-variant-numeric: tabular-nums; letter-spacing: 2px; line-height: 1.2; }
  .qtext.small { font-size: 30px; }
  .ansline { font-size: 40px; min-height: 52px; font-variant-numeric: tabular-nums; }
  .ansline .cursor { color: var(--muted); }
  .feedback { font-size: 19px; min-height: 26px; font-weight: bold; }
  .feedback.ok { color: var(--good); }
  .feedback.ng { color: var(--ng-ink); }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; }
  .key {
    border: 2.5px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 18px; font-size: 30px; padding: 14px 0; box-shadow: var(--shadow);
    font-variant-numeric: tabular-nums;
  }
  .key:active { transform: scale(.96); background: var(--bg); }
  .key.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 24px; }
  .key.del { font-size: 24px; color: var(--muted); }

  /* ---- けっか ---- */
  .result { text-align: center; margin: auto 0; }
  .result .rstars { font-size: 34px; letter-spacing: 4px; min-height: 44px; }
  .result h2 { font-size: 28px; margin: 10px 0 4px; }
  .result .rtime { font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bestbadge {
    display: none; margin: 10px auto 0; width: fit-content;
    background: var(--star); color: #5C4400; font-weight: bold;
    border-radius: 999px; padding: 6px 18px; font-size: 16px;
  }
  .bestbadge.show { display: block; }
  .unlockbadge {
    display: none; margin: 10px auto 0; width: fit-content;
    background: #CBE3C2; color: #2F6B44; font-weight: bold;
    border-radius: 999px; padding: 6px 18px; font-size: 16px;
  }
  .unlockbadge.show { display: block; }
  .rcat { width: 96px; margin: 10px auto 0; }
  .rbubble {
    background: var(--bubble); border: 2px solid var(--line); border-radius: 16px;
    padding: 8px 14px; font-size: 16px; margin: 8px auto 0; max-width: 280px;
  }
  .rbtns { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .bigbtn {
    border: none; border-radius: 999px; padding: 14px; font-size: 19px; font-weight: bold;
    background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow);
  }
  .bigbtn.ghost { background: var(--card); color: var(--ink); border: 2.5px solid var(--line); font-weight: normal; }

  .soundline { text-align: center; margin-top: 14px; }
  .soundbtn { border: 2px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 13px 18px; font-size: 14px; }

  .flystar { position: absolute; font-size: 30px; pointer-events: none; animation: fly .8s ease forwards; left: 50%; top: 30%; }
  @keyframes fly { 0% { opacity: 1; transform: translate(-50%,0) scale(.8); } 100% { opacity: 0; transform: translate(-50%,-60px) scale(1.6); } }
  @media (prefers-reduced-motion: reduce) { .flystar { animation: none; opacity: 0; } }

  /* ---- せってい ---- */
  .settop { text-align: center; margin: 8px 0 6px; }
  .settop h2 { font-size: 24px; margin: 0; letter-spacing: .06em; }
  .setbubble {
    background: var(--bubble); border: 2px solid var(--line); border-radius: 16px;
    padding: 8px 14px; font-size: 15px; text-align: center; margin: 0 auto 12px; max-width: 320px;
  }
  .setcard {
    background: var(--card); border: 2px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px;
  }
  .setlabel { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  .sethint { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .nameinput {
    width: 100%; border: 2.5px solid var(--line); border-radius: 14px;
    background: var(--bg); color: var(--ink); font-family: inherit;
    font-size: 20px; padding: 12px 14px;
  }
  .nameinput:focus { outline: 3px solid var(--accent); outline-offset: 1px; }

  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .swatch {
    border: 3px solid var(--line); border-radius: 16px; background: var(--bg);
    padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 14px; color: var(--ink); min-height: 44px;
  }
  .swatch .dot { width: 30px; height: 30px; border-radius: 60% 40% 55% 45%; margin: 4px; }
  .swatch.sel { border-color: var(--accent); background: var(--bubble); font-weight: bold; }
  .swatch:active { transform: scale(.96); }

  .mascots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .mascot {
    border: 3px solid var(--line); border-radius: 16px; background: var(--bg);
    padding: 8px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 14px; color: var(--ink);
  }
  .mascot svg { width: 72px; height: 72px; }
  .mascot.sel { border-color: var(--accent); background: var(--bubble); font-weight: bold; }
  .mascot:active { transform: scale(.96); }

  .tglrow {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 0; border-bottom: 1.5px dashed var(--line); font-size: 17px;
  }
  .tglrow:last-child { border-bottom: none; }
  .tgl {
    border: none; width: 76px; height: 44px; border-radius: 999px;
    background: var(--lock); position: relative; flex: none;
  }
  .tgl::after {
    content: ""; position: absolute; top: 4px; left: 4px; width: 36px; height: 36px;
    border-radius: 50%; background: #FFFFFF; transition: transform .15s ease;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .tgl.on { background: var(--good); }
  .tgl.on::after { transform: translateX(32px); }
  @media (prefers-reduced-motion: reduce) { .tgl::after { transition: none; } }

  .setsave { margin-top: 6px; }
  .dangerline { text-align: center; margin: 16px 0 8px; }
  .dangerbtn { border: 2px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 13px 18px; font-size: 14px; }
</style>

<div class="app">

  <!-- ホーム -->
  <div class="screen show" id="scrHome">
    <div class="homehead">
      <button class="gearbtn" id="gearBtn" aria-label="せってい">⚙ せってい</button>
      <div class="cat" aria-hidden="true" id="homeCat"></div>
      <h1>⚡ フラッシュけいさん</h1>
      <div class="sub">10もん チャレンジ！ はやく ただしく こたえよう</div>
    </div>
    <div class="homebubble" id="homeSay">どれから やる？</div>
    <div class="modes">
      <button class="modebtn" data-mode="tashi" style="--mcolor: var(--m-tashi)">たしざん <span class="best" id="best-tashi"></span></button>
      <button class="modebtn" data-mode="hiki" style="--mcolor: var(--m-hiki)">ひきざん <span class="best" id="best-hiki"></span></button>
      <button class="modebtn" data-mode="maze" style="--mcolor: var(--m-maze)">まぜこぜ <span class="best" id="best-maze"></span></button>
      <button class="modebtn" data-mode="kazu" style="--mcolor: var(--m-kazu)">20までの かず <span class="best" id="best-kazu"></span></button>
    </div>
    <div class="soundline">
      <button class="soundbtn" id="soundBtn">🔔 おと：オン</button>
    </div>
  </div>

  <!-- せってい -->
  <div class="screen" id="scrSettings">
    <div class="settop"><h2>⚙ せってい</h2></div>
    <div class="setbubble" id="setSay">すきなように きせかえよう！</div>

    <div class="setcard">
      <label class="setlabel" for="setName" style="display:block">📛 よびな</label>
      <input class="nameinput" id="setName" maxlength="10" placeholder="れい：みかちゃん" autocomplete="off">
      <div class="sethint">よばれたい なまえを いれてね（「〜ちゃん」「〜くん」まで いれると そのまま よぶよ）</div>
    </div>

    <div class="setcard">
      <div class="setlabel">🎨 すきな いろ</div>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="setcard">
      <div class="setlabel">🐾 おうえんしてくれる どうぶつ</div>
      <div class="mascots" id="mascots"></div>
    </div>

    <div class="setcard">
      <div class="setlabel">✏️ もんだいの しゅるい</div>
      <div id="modeToggles"></div>
      <div class="sethint">たしざん・ひきざんは 10までの かず。「20までの かず」は かずの じゅんばんの もんだいだよ</div>
    </div>

    <div class="setcard">
      <div class="setlabel">🔓 じゅんばんロック</div>
      <div class="tglrow"><span style="font-size:14px;color:var(--muted)">パーフェクトで つぎのモードが ひらく</span>
        <button class="tgl" id="lockTgl" role="switch" aria-label="じゅんばんロック"></button>
      </div>
      <div class="sethint">オフにすると さいしょから ぜんぶ あそべるよ</div>
    </div>

    <button class="bigbtn setsave" id="setSaveBtn">これで OK！</button>
    <div class="dangerline">
      <button class="dangerbtn" id="wipeBtn">🗑 きろくを ぜんぶ けす</button>
    </div>
  </div>

  <!-- ゲーム -->
  <div class="screen" id="scrGame">
    <div class="gametop">
      <button class="quit" id="quitBtn">← やめる</button>
      <div class="prog" id="prog">1 / 10</div>
    </div>
    <div class="gamestars" id="gameStars"></div>
    <div class="qcard" id="qcard">
      <div class="qtext" id="qtext"></div>
      <div class="ansline" id="ansline"><span class="cursor">＿</span></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="pad">
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key del" data-k="del">⌫</button>
      <button class="key" data-k="0">0</button>
      <button class="key ok" data-k="ok">けってい</button>
    </div>
  </div>

  <!-- けっか -->
  <div class="screen" id="scrResult">
    <div class="result">
      <div class="rstars" id="rstars"></div>
      <h2 id="rmsg"></h2>
      <div class="rtime" id="rtime"></div>
      <div class="bestbadge" id="bestBadge">🏆 じぶんベスト こうしん！</div>
      <div class="unlockbadge" id="unlockBadge"></div>
      <div class="rcat" aria-hidden="true" id="resultCat"></div>
      <div class="rbubble" id="rsay"></div>
      <div class="rbtns">
        <button class="bigbtn" id="againBtn">もういちど！</button>
        <button class="bigbtn ghost" id="homeBtn">もどる</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";
  var KEY = "keisan-dekiai-v1";
  var MODES = {
    tashi: "たしざん", hiki: "ひきざん", maze: "まぜこぜ", kazu: "20までの かず"
  };
  var N_Q = 10;

  /* ---- きせかえテーマ（ライト/ダーク両方の値を持つ） ----
     2026-08-05 社長FB「色の変化が小さい」→ アクセントだけでなく
     紙色bg・カードcard・罫線line・ふきだしbubbleまで一式で染める全面きせかえに拡張 */
  var THEMES = {
    kongari: { name: "こんがり", a: "#E08A3C", aInk: "#FFFFFF", deco: "#F8EEDA", bg: "#FFFDF7", card: "#FFFFFF", line: "#E2D2B2", bubble: "#FBF3E0",
               aD: "#E89B55", aInkD: "#2A2314", decoD: "#2C332A", bgD: "#252B23", cardD: "#333C30", lineD: "#4A5340", bubbleD: "#3A4435" },
    momo:    { name: "もも",     a: "#D97A94", aInk: "#FFFFFF", deco: "#F7DFE6", bg: "#FDF4F6", card: "#FFFEFE", line: "#E8BECD", bubble: "#FAE7ED",
               aD: "#E893A5", aInkD: "#2A2314", decoD: "#332A2E", bgD: "#2B2326", cardD: "#3B3036", lineD: "#57424C", bubbleD: "#453640" },
    sora:    { name: "そら",     a: "#5B8DB8", aInk: "#FFFFFF", deco: "#DFECF6", bg: "#F3F8FC", card: "#FEFFFF", line: "#BCD5E8", bubble: "#E9F2F9",
               aD: "#8FB8D8", aInkD: "#1E2A33", decoD: "#28313B", bgD: "#212830", cardD: "#2E3A46", lineD: "#40525F", bubbleD: "#364450" },
    wakaba:  { name: "わかば",   a: "#5E9C56", aInk: "#FFFFFF", deco: "#E1EFDA", bg: "#F4FAF2", card: "#FEFFFE", line: "#BFDBB5", bubble: "#E9F3E4",
               aD: "#85C07B", aInkD: "#20301E", decoD: "#2A3327", bgD: "#232B21", cardD: "#30402D", lineD: "#48583F", bubbleD: "#394833" },
    tanpopo: { name: "たんぽぽ", a: "#C08A2E", aInk: "#FFFFFF", deco: "#F7EDCC", bg: "#FEF9EA", card: "#FFFEFA", line: "#E0C384", bubble: "#FAF0D2",

               aD: "#BCA9E0", aInkD: "#272238", decoD: "#2D2A3B", bgD: "#262331", cardD: "#353046", lineD: "#4E4763", bubbleD: "#403A52" }
  };

  /* ---- おうえんどうぶつ（白猫と同じ描き文法：フチ#E6D8BF系・目#5B4A3F・ほっぺ#F6C6CF） ---- */
  function catBase(body, line, opts) {
    opts = opts || {};
    var s = '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">';
    s += opts.tail || '<path d="M97 88 Q114 84 110 68 Q108 60 100 62" fill="none" stroke="' + line + '" stroke-width="9" stroke-linecap="round"/>';
    s += '<ellipse cx="60" cy="92" rx="34" ry="22" fill="' + body + '" stroke="' + line + '" stroke-width="2.5"/>';
    s += opts.ears || "";
    s += '<circle cx="60" cy="52" r="33" fill="' + body + '" stroke="' + line + '" stroke-width="2.5"/>';

    s += opts.mouth || '<path d="M54 62 Q57 66 60 62 Q63 66 66 62" fill="none" stroke="#5B4A3F" stroke-width="2" stroke-linecap="round"/>';
    s += '<ellipse cx="46" cy="106" rx="9" ry="6" fill="' + body + '" stroke="' + line + '" stroke-width="2.5"/>';

  var MASCOTS = {

            '<circle cx="34" cy="24" r="5" fill="#EBD3A8"/><circle cx="86" cy="24" r="5" fill="#EBD3A8"/>',
      tail: '<circle cx="96" cy="94" r="7" fill="#F5E6C8" stroke="#DCC49B" stroke-width="2.5"/>',
      mouth: '<ellipse cx="60" cy="63" rx="12" ry="9" fill="#FBF3E0"/>' +
             '<ellipse cx="60" cy="59" rx="4" ry="3.2" fill="#B5722F"/>' +
             '<path d="M60 62 L60 66 M54 68 Q57 71 60 66 Q63 71 66 68" fill="none" stroke="#5B4A3F" stroke-width="2" stroke-linecap="round"/>',
      chest: '<ellipse cx="60" cy="90" rx="13" ry="10" fill="#FBF3E0"/>'
    }) },
    panda: { name: "ぱんだ", svg: catBase("#FFFFFF", "#D9CDBB", {
      ears: '<circle cx="34" cy="24" r="11" fill="#6B5A4E"/><circle cx="86" cy="24" r="11" fill="#6B5A4E"/>',
      tail: '<circle cx="96" cy="94" r="7" fill="#6B5A4E"/>',
      face: '<ellipse cx="46" cy="50" rx="8.5" ry="10.5" fill="#6B5A4E" transform="rotate(-14 46 50)"/>' +
            '<ellipse cx="74" cy="50" rx="8.5" ry="10.5" fill="#6B5A4E" transform="rotate(14 74 50)"/>' +
            '<circle cx="47" cy="49" r="3" fill="#FFFFFF"/><circle cx="73" cy="49" r="3" fill="#FFFFFF"/>' +
            '<circle cx="47.8" cy="48.2" r="1.1" fill="#5B4A3F"/><circle cx="72.2" cy="48.2" r="1.1" fill="#5B4A3F"/>',
      mouth: '<ellipse cx="60" cy="59" rx="4" ry="3" fill="#5B4A3F"/>' +
             '<path d="M54 65 Q57 68 60 64 Q63 68 66 65" fill="none" stroke="#5B4A3F" stroke-width="2" stroke-linecap="round"/>',
      /* 首の黒帯は廃止（2026-08-05 社長FB「首が変」）→ 本物のぱんだと同じ「うでと足が黒」に
         うで・足の座標と輪郭線はdezainレビュー値（ボディの輪郭線を消さない・足の線の太さを他の3匹と揃える） */
      cheeks: '<ellipse cx="36" cy="66" rx="5.5" ry="3.5" fill="#F6C6CF"/>' +
              '<ellipse cx="84" cy="66" rx="5.5" ry="3.5" fill="#F6C6CF"/>',
      chest: '<ellipse cx="36" cy="88" rx="7.5" ry="10" fill="#6B5A4E" transform="rotate(14 36 88)"/>' +
             '<ellipse cx="84" cy="88" rx="7.5" ry="10" fill="#6B5A4E" transform="rotate(-14 84 88)"/>' +
             '<ellipse cx="46" cy="106" rx="9" ry="6" fill="#6B5A4E" stroke="#D9CDBB" stroke-width="2.5"/>' +
             '<ellipse cx="74" cy="106" rx="9" ry="6" fill="#6B5A4E" stroke="#D9CDBB" stroke-width="2.5"/>'
    }) }
  };

  /* ---- 難易度ロック：パーフェクトで次のモードが開く ---- */
  var ALWAYS_OPEN = { tashi: true, kazu: true };
  var UNLOCK_NEXT = { tashi: "hiki", hiki: "maze" };
  var LOCK_PREV = { hiki: "tashi", maze: "hiki" };
  function isOpen(mode) {
    if (!data.settings.lock) return true;
    if (ALWAYS_OPEN[mode] || data.unlocked[mode]) return true;
    // ひとつ前のモードが「せってい」で消されていたら、まてないので開けておく
    var prev = LOCK_PREV[mode];
    if (prev && data.settings.modes[prev] === false) return true;
    return false;
  }

  /* ---- 保存 ---- */
  function defaultSettings() {
    return {
      name: "",
      theme: "kongari",
      mascot: "neko",
      modes: { tashi: true, hiki: true, maze: true, kazu: true },
      lock: true
    };
  }
  function loadData() {
    try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
    return { best: {}, sound: true };
  }
  function saveData() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  var data = loadData();
  var firstRun = !data.settings;
  if (!data.settings) data.settings = defaultSettings();
  if (!data.settings.modes) data.settings.modes = defaultSettings().modes;
  if (!data.unlocked) data.unlocked = {};
  for (var mk in data.best) { if (data.best[mk]) data.unlocked[mk] = true; }

  /* ---- テーマ・マスコットの反映 ---- */
  var themeStyle = document.createElement("style");
  document.head ? document.head.appendChild(themeStyle) : document.body.appendChild(themeStyle);
  function applyTheme() {
    var t = THEMES[data.settings.theme] || THEMES.kongari;
    var light = "--accent:" + t.a + ";--accent-ink:" + t.aInk + ";--bg-deco:" + t.deco + ";" +
      "--bg:" + t.bg + ";--card:" + t.card + ";--line:" + t.line + ";--bubble:" + t.bubble + ";";
    var dark = "--accent:" + t.aD + ";--accent-ink:" + t.aInkD + ";--bg-deco:" + t.decoD + ";" +
      "--bg:" + t.bgD + ";--card:" + t.cardD + ";--line:" + t.lineD + ";--bubble:" + t.bubbleD + ";";
    themeStyle.textContent =
      ":root{" + light + "}" +
      "@media (prefers-color-scheme: dark){:root{" + dark + "}}" +
      ':root[data-theme="light"]{' + light + "}" +
      ':root[data-theme="dark"]{' + dark + "}";
  }
  function applyMascot() {
    var m = MASCOTS[data.settings.mascot] || MASCOTS.neko;
    document.getElementById("homeCat").innerHTML = m.svg;
    document.getElementById("resultCat").innerHTML = m.svg;
  }

  /* ---- おと（WebAudio・こわれても無視） ---- */
  var actx = null;
  function beep(kind) {
    if (!data.sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime;
      var o = actx.createOscillator(); var g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.12, t);
      if (kind === "ok") {
        o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.09);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.start(t); o.stop(t + 0.25);
      } else if (kind === "ng") {
        o.frequency.setValueAtTime(220, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.start(t); o.stop(t + 0.2);
      } else {
        o.frequency.setValueAtTime(1568, t); o.frequency.setValueAtTime(2093, t + 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.5); o.start(t); o.stop(t + 0.5);
      }
    } catch (e) {}
  }

  /* ---- もんだいづくり ---- */
  function rnd(n) { return Math.floor(Math.random() * n); }
  function makeQ(mode) {
    var m = mode === "maze" ? (rnd(2) ? "tashi" : "hiki") : mode;
    if (m === "tashi") {
      var a = 1 + rnd(9); var b = 1 + rnd(10 - a);
      return { text: a + " ＋ " + b + " ＝", ans: a + b, small: false };
    }
    if (m === "hiki") {
      var a2 = 2 + rnd(9); var b2 = 1 + rnd(a2 - 1);
      return { text: a2 + " − " + b2 + " ＝", ans: a2 - b2, small: false };
    }
    var type = rnd(3);
    if (type === 0) { var n = 1 + rnd(10); return { text: "10と " + n + " で？", ans: 10 + n, small: true }; }
    if (type === 1) { var m1 = 10 + rnd(10); return { text: m1 + " の つぎは？", ans: m1 + 1, small: true }; }
    var m2 = 11 + rnd(10); return { text: m2 + " の ひとつ まえは？", ans: m2 - 1, small: true };
  }
  function makeSet(mode) {
    var qs = []; var used = {};
    while (qs.length < N_Q) {
      var q = makeQ(mode); var sig = q.text;
      if (used[sig] && qs.length < 30) { if (Math.random() < 0.8) continue; }
      used[sig] = true; qs.push(q);
    }
    return qs;
  }

  /* ---- 画面きりかえ ---- */
  function show(id) {
    var scrs = document.querySelectorAll(".screen");
    for (var i = 0; i < scrs.length; i++) scrs[i].className = "screen";
    document.getElementById(id).className = "screen show";
  }

  /* ---- ホーム ---- */
  function fmtTime(ms) { return (ms / 1000).toFixed(1) + "びょう"; }
  function callName() { return data.settings.name ? data.settings.name : ""; }
  function renderHome() {
    for (var k in MODES) {
      var el = document.getElementById("best-" + k);
      var btn = document.querySelector('.modebtn[data-mode="' + k + '"]');
      btn.style.display = data.settings.modes[k] === false ? "none" : "";
      if (!isOpen(k)) {
        btn.classList.add("locked");
        btn.setAttribute("aria-disabled", "true");
        el.textContent = "🔒 " + MODES[LOCK_PREV[k]] + "で パーフェクトを とると ひらくよ";
      } else {
        btn.classList.remove("locked");
        btn.removeAttribute("aria-disabled");
        var b = data.best[k];
        el.textContent = b ? "ベスト：" + b.correct + "もん・" + fmtTime(b.timeMs) : "";
      }
    }
    var nm = callName();
    document.getElementById("homeSay").textContent = nm ? nm + "、どれから やる？" : "どれから やる？";
    document.getElementById("soundBtn").textContent = data.sound ? "🔔 おと：オン" : "🔕 おと：オフ";
  }
  document.getElementById("soundBtn").addEventListener("click", function () {
    data.sound = !data.sound; saveData(); renderHome();
  });

  /* ---- せってい画面 ---- */
  var swWrap = document.getElementById("swatches");
  var msWrap = document.getElementById("mascots");
  var mtWrap = document.getElementById("modeToggles");
  function buildSettings() {
    var html = "";
    for (var tk in THEMES) {
      html += '<button class="swatch" data-theme="' + tk + '">' +
        '<span class="dot" style="background:' + THEMES[tk].a + ';box-shadow:0 0 0 5px ' + THEMES[tk].deco + '"></span>' + THEMES[tk].name + "</button>";
    }
    swWrap.innerHTML = html;
    html = "";
    for (var mk2 in MASCOTS) {
      html += '<button class="mascot" data-mascot="' + mk2 + '">' + MASCOTS[mk2].svg + MASCOTS[mk2].name + "</button>";
    }
    msWrap.innerHTML = html;
    html = "";
    for (var k2 in MODES) {
      html += '<div class="tglrow">' + MODES[k2] +
        '<button class="tgl" data-modetgl="' + k2 + '" role="switch" aria-label="' + MODES[k2] + '"></button></div>';
    }
    mtWrap.innerHTML = html;
  }
  function renderSettings() {
    var i, els;
    els = swWrap.querySelectorAll(".swatch");
    for (i = 0; i < els.length; i++) els[i].classList.toggle("sel", els[i].getAttribute("data-theme") === data.settings.theme);
    els = msWrap.querySelectorAll(".mascot");
    for (i = 0; i < els.length; i++) els[i].classList.toggle("sel", els[i].getAttribute("data-mascot") === data.settings.mascot);
    els = mtWrap.querySelectorAll(".tgl");
    for (i = 0; i < els.length; i++) {
      var on = data.settings.modes[els[i].getAttribute("data-modetgl")] !== false;
      els[i].classList.toggle("on", on);
      els[i].setAttribute("aria-checked", on ? "true" : "false");
    }
    var lt = document.getElementById("lockTgl");
    lt.classList.toggle("on", !!data.settings.lock);
    lt.setAttribute("aria-checked", data.settings.lock ? "true" : "false");
    document.getElementById("setName").value = data.settings.name || "";
  }
  function countOnModes() {
    var c = 0;
    for (var k in MODES) { if (data.settings.modes[k] !== false) c++; }
    return c;
  }
  swWrap.addEventListener("click", function (e) {
    var b = e.target.closest(".swatch"); if (!b) return;
    data.settings.theme = b.getAttribute("data-theme");
    saveData(); applyTheme(); renderSettings();
  });
  msWrap.addEventListener("click", function (e) {
    var b = e.target.closest(".mascot"); if (!b) return;
    data.settings.mascot = b.getAttribute("data-mascot");
    saveData(); applyMascot(); renderSettings();
    document.getElementById("setSay").textContent = MASCOTS[data.settings.mascot].name + "が おうえんするよ！";
  });
  mtWrap.addEventListener("click", function (e) {
    var b = e.target.closest(".tgl"); if (!b) return;
    var k = b.getAttribute("data-modetgl");
    var nowOn = data.settings.modes[k] !== false;
    if (nowOn && countOnModes() <= 1) {
      document.getElementById("setSay").textContent = "もんだいは 1つは のこしてね";
      return;
    }
    data.settings.modes[k] = !nowOn;
    saveData(); renderSettings();
  });
  document.getElementById("lockTgl").addEventListener("click", function () {
    data.settings.lock = !data.settings.lock;
    saveData(); renderSettings();
  });
  document.getElementById("setName").addEventListener("input", function () {
    data.settings.name = this.value.trim().slice(0, 10);
    saveData();
  });
  document.getElementById("gearBtn").addEventListener("click", function () {
    document.getElementById("setSay").textContent = "すきなように きせかえよう！";
    renderSettings(); show("scrSettings");
  });
  document.getElementById("setSaveBtn").addEventListener("click", function () {
    renderHome(); show("scrHome");
    var nm = callName();
    document.getElementById("homeSay").textContent = nm ? "せってい できたよ！ " + nm + "、どれから やる？" : "せってい できたよ！ どれから やる？";
  });
  document.getElementById("wipeBtn").addEventListener("click", function () {
    if (!confirm("ベストきろくと ひらいたモードを ぜんぶ けします。いいですか？")) return;
    data.best = {}; data.unlocked = {};
    saveData(); renderSettings();
    document.getElementById("setSay").textContent = "きろくを けしたよ。まっさらで スタート！";
  });

  /* ---- ゲームの状態 ---- */
  var game = null;
  document.querySelector(".modes").addEventListener("click", function (e) {
    var b = e.target.closest(".modebtn"); if (!b) return;
    var mode = b.getAttribute("data-mode");
    if (!isOpen(mode)) {
      document.getElementById("homeSay").textContent =
        "「" + MODES[LOCK_PREV[mode]] + "」で パーフェクト（ぜんぶ せいかい）を とると ひらくよ！";
      b.classList.remove("deny");
      void b.offsetWidth;
      b.classList.add("deny");
      setTimeout(function () { b.classList.remove("deny"); }, 350);
      return;
    }
    startGame(mode);
  });
  function startGame(mode) {
    game = { mode: mode, qs: makeSet(mode), idx: 0, correct: 0, input: "", start: Date.now(), busy: false };
    show("scrGame");
    renderQ(true);
  }
  document.getElementById("quitBtn").addEventListener("click", function () {
    game = null; renderHome(); show("scrHome");
  });

  function renderQ(pop) {
    var q = game.qs[game.idx];
    document.getElementById("prog").textContent = (game.idx + 1) + " / " + N_Q;
    var stars = ""; for (var i = 0; i < game.correct; i++) stars += "⭐";
    document.getElementById("gameStars").textContent = stars;
    var qt = document.getElementById("qtext");
    qt.textContent = q.text;
    qt.className = "qtext" + (q.small ? " small" : "");
    document.getElementById("ansline").innerHTML = game.input === "" ? '<span class="cursor">＿</span>' : game.input;
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").className = "feedback";
    var card = document.getElementById("qcard");
    card.className = "qcard" + (pop ? " pop" : "");
    if (pop) setTimeout(function () { card.className = "qcard"; }, 260);
  }

  document.querySelector(".pad").addEventListener("click", function (e) {
    var b = e.target.closest(".key"); if (!b || !game || game.busy) return;
    var k = b.getAttribute("data-k");
    if (k === "del") { game.input = game.input.slice(0, -1); }
    else if (k === "ok") { check(); return; }
    else { if (game.input.length < 2) game.input += k; }
    document.getElementById("ansline").innerHTML = game.input === "" ? '<span class="cursor">＿</span>' : game.input;
  });

  function check() {
    if (game.input === "") return;
    var q = game.qs[game.idx];
    var card = document.getElementById("qcard");
    var fb = document.getElementById("feedback");
    game.busy = true;
    if (parseInt(game.input, 10) === q.ans) {
      game.correct++;
      beep("ok");
      card.className = "qcard right";
      fb.textContent = "せいかい！";
      fb.className = "feedback ok";
      var s = document.createElement("span"); s.className = "flystar"; s.textContent = "⭐";
      card.appendChild(s);
      setTimeout(next, 550);
    } else {
      beep("ng");
      card.className = "qcard wrong";
      fb.textContent = "こたえは " + q.ans + " だよ";
      fb.className = "feedback ng";
      setTimeout(next, 1400);
    }
  }
  function next() {
    game.busy = false;
    game.input = "";
    game.idx++;
    if (game.idx >= N_Q) { finish(); return; }
    renderQ(true);
  }

  /* ---- けっか ---- */
  function finish() {
    var timeMs = Date.now() - game.start;
    var stars = ""; for (var i = 0; i < game.correct; i++) stars += "⭐";
    document.getElementById("rstars").textContent = stars || "…";
    document.getElementById("rmsg").textContent = game.correct + "もん せいかい！";
    document.getElementById("rtime").textContent = MODES[game.mode] + "・" + fmtTime(timeMs);

    var prev = data.best[game.mode];
    var isBest = !prev || game.correct > prev.correct ||
      (game.correct === prev.correct && timeMs < prev.timeMs);
    if (isBest) { data.best[game.mode] = { correct: game.correct, timeMs: timeMs }; saveData(); }
    document.getElementById("bestBadge").className = "bestbadge" + (isBest ? " show" : "");

    var unlockedName = "";
    if (game.correct === N_Q) {
      var nx = UNLOCK_NEXT[game.mode];
      if (nx && data.settings.modes[nx] !== false && !(ALWAYS_OPEN[nx] || data.unlocked[nx])) {
        data.unlocked[nx] = true; saveData(); unlockedName = MODES[nx];
      }
    }
    var ub = document.getElementById("unlockBadge");
    ub.textContent = unlockedName ? "🔓 「" + unlockedName + "」が あそべるように なったよ！" : "";
    ub.className = "unlockbadge" + (unlockedName ? " show" : "");

    var nm = callName();
    var say;
    if (game.correct === N_Q) { say = (nm ? nm + " " : "") + "パーフェクト！！ てんさい！！"; beep("fanfare"); }
    else if (game.correct >= 8) say = (nm ? nm + "、" : "") + "すごい！ あと ちょっとで パーフェクト！";
    else if (game.correct >= 5) say = "いいちょうし！ もういっかい やってみる？";
    else say = "だいじょうぶ、ゆっくりで いいよ♪";
    document.getElementById("rsay").textContent = say;

    var last = game.mode;
    document.getElementById("againBtn").onclick = function () { startGame(last); };
    show("scrResult");
  }
  document.getElementById("homeBtn").addEventListener("click", function () {
    renderHome(); show("scrHome");
  });

  /* ---- 起動 ---- */
  buildSettings();
  applyTheme();
  applyMascot();
  renderHome();
  if (firstRun) {
    saveData();
    document.getElementById("setSay").textContent = "ようこそ！ さいしょに すきなように せっていしよう";
    renderSettings();
    show("scrSettings");
  }
})();
</script>
